<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Всё о футболе — Энциклопедия и Викторина</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: #14171d;
      --card-hover: #1c2028;
      --border-color: #262b35;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --gradient-orange: linear-gradient(135deg, #ffffff 0%, #ff6b00 100%);
      --accent-orange: #ff6b00;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    /* Header */
    header {
      margin-bottom: 32px;
      text-align: center;
      position: relative;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--gradient-orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .back-btn:hover {
      border-color: var(--accent-orange);
      color: var(--accent-orange);
    }

    /* Views */
    .view {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LEVEL 1: Tournament Grid & Quiz Banner */
    .tournaments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .tournament-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .tournament-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-orange);
      transform: translateY(-3px);
    }

    .tournament-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .tournament-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .quiz-banner {
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.15) 0%, rgba(20, 23, 29, 0.8) 100%);
      border: 1px solid var(--accent-orange);
      border-radius: var(--radius);
      padding: 28px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .quiz-banner:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(255, 107, 0, 0.2);
    }

    .quiz-banner h3 {
      font-size: 1.3rem;
      margin-bottom: 6px;
      background: var(--gradient-orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* LEVEL 2: Season List */
    .seasons-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .season-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .season-item:hover {
      background: var(--card-hover);
      border-color: var(--accent-orange);
    }

    .season-year {
      font-weight: 700;
      color: var(--accent-orange);
      font-size: 1rem;
      width: 80px;
    }

    .season-matchup {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: center;
    }

    .season-winner-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .season-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .season-score {
      font-weight: 800;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    /* LEVEL 3: Match Details */
    .match-detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 32px 24px;
    }

    .match-header {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 32px;
      text-align: center;
    }

    .team-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 140px;
    }

    .team-box img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .team-name {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .match-score-big {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--gradient-orange);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .match-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-orange);
      margin: 24px 0 12px 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .events-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .event-item {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
    }

    .event-item strong {
      color: var(--text-main);
    }

    /* Quiz Box */
    .quiz-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 32px 24px;
      max-width: 600px;
      margin: 0 auto;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: 600;
      color: var(--accent-orange);
    }

    .quiz-question {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .quiz-option {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--text-main);
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--accent-orange);
    }

    .quiz-option.correct {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: var(--success);
    }

    .quiz-option.wrong {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }

    .quiz-btn {
      background: var(--gradient-orange);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">Всё о футболе</div>
      <div class="subtitle">Главная энциклопедия турниров и матчей</div>
    </header>

    <!-- LEVEL 1: Main View -->
    <div class="view active" id="viewLevel1">
      <div class="tournaments-grid" id="tournamentsGrid"></div>
      
      <div class="quiz-banner" onclick="openQuiz()">
        <div>
          <h3>🎯 Футбольная Викторина</h3>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Проверьте свои знания истории ЧМ и Лиги Чемпионов</p>
        </div>
        <span style="font-size: 1.5rem;">→</span>
      </div>
    </div>

    <!-- LEVEL 2: Season List View -->
    <div class="view" id="viewLevel2">
      <button class="back-btn" onclick="showLevel(1)">← Назад к турнирам</button>
      <h2 id="tournamentTitle" style="margin-bottom: 20px; font-size: 1.5rem;"></h2>
      <div class="seasons-list" id="seasonsList"></div>
    </div>

    <!-- LEVEL 3: Match Details View -->
    <div class="view" id="viewLevel3">
      <button class="back-btn" onclick="showLevel(2)">← Назад к сезонам</button>
      <div class="match-detail-card" id="matchDetailCard"></div>
    </div>

    <!-- QUIZ View -->
    <div class="view" id="viewQuiz">
      <button class="back-btn" onclick="showLevel(1)">← Назад на главную</button>
      <div class="quiz-container">
        <div id="quizContent">
          <div class="quiz-header">
            <span>Викторина</span>
            <span id="quizProgress"></span>
          </div>
          <div class="quiz-question" id="quizQuestion"></div>
          <div class="quiz-options" id="quizOptions"></div>
          <button class="quiz-btn" id="quizNextBtn" style="display:none;">Следующий вопрос</button>
        </div>
        <div id="quizResult" style="display:none; text-align: center;">
          <h2 style="margin-bottom: 12px;">Завершено!</h2>
          <div id="quizScoreText" style="font-size: 2rem; font-weight: 800; color: var(--accent-orange); margin-bottom: 16px;"></div>
          <button class="quiz-btn" onclick="startQuiz()">Пройти снова</button>
        </div>
      </div>
    </div>

    <footer>
      Всё о футболе &copy; 2026. Все права защищены.
    </footer>
  </div>

  <script>
    // Database
    const tournaments = [
      { id: "wc", name: "Чемпионат Мира", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e3/FIFA_World_Cup_trophy_icon.svg" },
      { id: "ucl", name: "Лига Чемпионов", logo: "https://upload.wikimedia.org/wikipedia/commons/b/bf/UEFA_Champions_League_logo_2021.svg" },
      { id: "copa", name: "Копа Америка", logo: "https://upload.wikimedia.org/wikipedia/commons/1/17/Copa_America_logo.svg" },
      { id: "laliga", name: "Ла Лига", logo: "https://upload.wikimedia.org/wikipedia/commons/0/0f/LaLiga_EA_Sports_2023_Logo.svg" },
      { id: "epl", name: "Премьер-Лига", logo: "https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg" }
    ];

    const matchData = {
      wc: [
        {
          year: "2022",
          winner: "Аргентина",
          winnerLogo: "https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg",
          runnerUp: "Франция",
          runnerUpLogo: "https://upload.wikimedia.org/wikipedia/commons/c/c3/Flag_of_France.svg",
          score: "3:3 (4:2 пен.)",
          goals: ["Месси 23' (пен.), 108'", "Ди Мария 36'", "Мбаппе 80' (пен.), 81', 118' (пен.)"],
          assists: ["Мак Аллистер (36')", "Тюрам (81')"],
          venue: "Лусаил Айконик, Катар"
        },
        {
          year: "2018",
          winner: "Франция",
          winnerLogo: "https://upload.wikimedia.org/wikipedia/commons/c/c3/Flag_of_France.svg",
          runnerUp: "Хорватия",
          runnerUpLogo: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Flag_of_Croatia.svg",
          score: "4:2",
          goals: ["Манджукич 18' (автогол)", "Перишич 28'", "Гризманн 38' (пен.)", "Погба 59'", "Мбаппе 65'", "Манджукич 69'"],
          assists: ["Вида (28')", "Мбаппе (59')", " Эрнандес (65')"],
          venue: "Лужники, Москва"
        }
      ],
      ucl: [
        {
          year: "2024",
          winner: "Реал Мадрид",
          winnerLogo: "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",
          runnerUp: "Боруссия Д",
          runnerUpLogo: "https://upload.wikimedia.org/wikipedia/commons/6/67/Borusse_Dortmund_logo.svg",
          score: "2:0",
          goals: ["Карвахаль 74'", "Винисиус 83'"],
          assists: ["Кроос (74')", "Беллингем (83')"],
          venue: "Уэмбли, Лондон"
        }
      ]
    };

    const quizQuestions = [
      { q: "Кто выиграл Чемпионат Мира 2022 года?", opts: ["Франция", "Аргентина", "Бразилия", "Хорватия"], corr: 1 },
      { q: "Сколько финалов ЛЧ выиграл Реал Мадрид к 2024 году?", opts: ["10", "12", "15", "18"], corr: 2 }
    ];

    let activeTournament = null;
    let quizIdx = 0;
    let quizScore = 0;

    // View Navigation
    function showLevel(level) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`viewLevel${level}`).classList.add('active');
    }

    // Level 1 Initialization
    function initLevel1() {
      const grid = document.getElementById('tournamentsGrid');
      grid.innerHTML = '';
      tournaments.forEach(t => {
        grid.innerHTML += `
          <div class="tournament-card" onclick="openTournament('${t.id}')">
            <span class="tournament-title">${t.name}</span>
            <img class="tournament-logo" src="${t.logo}" alt="${t.name}">
          </div>
        `;
      });
    }

    // Level 2 Open
    function openTournament(id) {
      activeTournament = id;
      const t = tournaments.find(x => x.id === id);
      document.getElementById('tournamentTitle').textContent = t.name;
      
      const list = document.getElementById('seasonsList');
      list.innerHTML = '';

      const seasons = matchData[id] || [];
      if (seasons.length === 0) {
        list.innerHTML = `<p style="color: var(--text-muted)">История турнира обновляется...</p>`;
      } else {
        seasons.forEach((s, idx) => {
          list.innerHTML += `
            <div class="season-item" onclick="openMatch(${idx})">
              <span class="season-year">${s.year}</span>
              <div class="season-matchup">
                <div class="season-winner-info">
                  <span>${s.winner}</span>
                  <img class="season-logo" src="${s.winnerLogo}">
                </div>
                <span class="season-score">${s.score}</span>
                <div class="season-winner-info" style="color: var(--text-muted)">
                  <img class="season-logo" src="${s.runnerUpLogo}">
                  <span>${s.runnerUp}</span>
                </div>
              </div>
            </div>
          `;
        });
      }
      showLevel(2);
    }

    // Level 3 Open
    function openMatch(index) {
      const match = matchData[activeTournament][index];
      const card = document.getElementById('matchDetailCard');
      
      card.innerHTML = `
        <div class="match-header">
          <div class="team-box">
            <img src="${match.winnerLogo}">
            <span class="team-name">${match.winner}</span>
          </div>
          <div class="match-score-big">${match.score}</div>
          <div class="team-box">
            <img src="${match.runnerUpLogo}">
            <span class="team-name" style="color: var(--text-muted)">${match.runnerUp}</span>
          </div>
        </div>

        <div class="match-section-title">⚽ Авторы голов</div>
        <ul class="events-list">
          ${match.goals.map(g => `<li class="event-item"><strong>${g}</strong></li>`).join('')}
        </ul>

        <div class="match-section-title">🅰️ Голевые передачи (Ассисты)</div>
        <ul class="events-list">
          ${match.assists.map(a => `<li class="event-item"><span>${a}</span></li>`).join('')}
        </ul>

        <div class="match-section-title">📍 Место проведения</div>
        <p style="font-size: 0.9rem; color: var(--text-muted);">${match.venue}</p>
      `;
      showLevel(3);
    }

    // Quiz Functions
    function openQuiz() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('viewQuiz').classList.add('active');
      startQuiz();
    }

    function startQuiz() {
      quizIdx = 0;
      quizScore = 0;
      document.getElementById('quizResult').style.display = 'none';
      document.getElementById('quizContent').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizQuestions[quizIdx];
      document.getElementById('quizProgress').textContent = `${quizIdx + 1}/${quizQuestions.length}`;
      document.getElementById('quizQuestion').textContent = q.q;
      document.getElementById('quizNextBtn').style.display = 'none';
      
      const opts = document.getElementById('quizOptions');
      opts.innerHTML = '';
      q.opts.forEach((o, i) => {
        opts.innerHTML += `<button class="quiz-option" onclick="answerQuiz(${i})">${o}</button>`;
      });
    }

    function answerQuiz(i) {
      const q = quizQuestions[quizIdx];
      const btns = document.querySelectorAll('.quiz-option');
      btns.forEach((b, idx) => {
        b.disabled = true;
        if (idx === q.corr) b.classList.add('correct');
        else if (idx === i) b.classList.add('wrong');
      });
      if (i === q.corr) quizScore++;
      
      if (quizIdx < quizQuestions.length - 1) {
        document.getElementById('quizNextBtn').style.display = 'block';
        document.getElementById('quizNextBtn').onclick = () => { quizIdx++; renderQuestion(); };
      } else {
        setTimeout(() => {
          document.getElementById('quizContent').style.display = 'none';
          document.getElementById('quizResult').style.display = 'block';
          document.getElementById('quizScoreText').textContent = `${quizScore} / ${quizQuestions.length}`;
        }, 1000);
      }
    }

    // Init
    initLevel1();
  </script>
</body>
</html>
