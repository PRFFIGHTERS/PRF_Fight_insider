<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promising Russian Fighters — Премиум платформа</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --orange: #FF5500;
    --orange-hover: #E04B00;
    --orange-light: rgba(255, 85, 0, 0.08);
    --orange-glow: rgba(255, 85, 0, 0.25);
    --bg: #FAFAFC;
    --card-bg: #FFFFFF;
    --text-dark: #111827;
    --text-muted: #6B7280;
    --border: #E5E7EB;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    min-height: 100vh;
    padding-bottom: 110px;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== HEADER ===== */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 72px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 38px; height: 38px; background: var(--orange); color: #fff;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; box-shadow: 0 4px 12px var(--orange-glow);
  }
  .logo-text { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.1; color: var(--text-dark); }
  .logo-text span { color: var(--orange); }
  
  nav { display: flex; gap: 32px; }
  nav a { font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; transition: color 0.2s; font-weight: 600; }
  nav a:hover { color: var(--orange); }

  /* ===== HERO SECTION ===== */
  .hero { position: relative; padding: 64px 24px 40px; text-align: center; }
  .hero-eyebrow { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--orange); margin-bottom: 12px; font-weight: 600; }
  .hero-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(38px, 6vw, 68px); text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; margin-bottom: 16px; color: var(--text-dark); }
  .hero-title em { font-style: normal; color: var(--orange); }
  .hero-sub { font-size: 16px; color: var(--text-muted); max-width: 520px; margin: 0 auto 36px; line-height: 1.6; font-weight: 400; }

  /* ===== SPORTS SELECTOR (ПЕРВЫМ ДЕЛОМ) ===== */
  .sports-section { max-width: 1100px; margin: 0 auto 48px; padding: 0 24px; }
  .section-title { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

  .sports-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 14px;
  }
  .sport-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    user-select: none;
  }
  .sport-card .icon { font-size: 28px; margin-bottom: 8px; display: block; }
  .sport-card .label { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dark); }
  
  .sport-card:hover {
    border-color: var(--orange);
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255, 85, 0, 0.12);
  }
  .sport-card.active {
    background: var(--orange);
    border-color: var(--orange);
    box-shadow: 0 8px 24px var(--orange-glow);
  }
  .sport-card.active .label { color: #FFFFFF; }

  /* ===== SEARCH WRAPPER ===== */
  .search-wrap { max-width: 520px; margin: 0 auto 48px; position: relative; padding: 0 24px; }
  .search-wrap input {
    width: 100%; padding: 16px 20px 16px 52px;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 50px; color: var(--text-dark); font-family: 'Inter', sans-serif; font-size: 15px; outline: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    transition: all 0.2s;
  }
  .search-wrap input::placeholder { color: var(--text-muted); }
  .search-wrap input:focus { border-color: var(--orange); box-shadow: 0 6px 20px var(--orange-glow); }
  .search-icon { position: absolute; left: 44px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

  /* ===== FIGHTERS GRID ===== */
  .section-label { display: flex; align-items: center; gap: 16px; max-width: 1100px; margin: 0 auto 32px; padding: 0 24px; }
  .section-label span { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .fighters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; }

  .fighter-card {
    background: var(--card-bg); border-radius: 16px; overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.04);
    transition: all 0.3s ease;
  }
  .fighter-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.08), 0 0 0 2px var(--orange); border-color: var(--orange); }

  .card-photo { position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden; background: #EEF0F4; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: transform 0.5s ease; display: block; }
  .fighter-card:hover .card-photo img { transform: scale(1.04); }
  .card-photo-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 40%; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%); }
  .card-sport-tag { position: absolute; top: 16px; right: 16px; background: var(--orange); color: #fff; font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; padding: 6px 14px; border-radius: 50px; font-weight: 600; box-shadow: 0 4px 12px var(--orange-glow); z-index: 2; }

  .card-body { padding: 24px; }
  .card-name { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.1; margin-bottom: 16px; color: var(--text-dark); }
  .card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-block { background: var(--bg); border-radius: 10px; padding: 12px 8px; text-align: center; border: 1px solid var(--border); }
  .stat-value { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: var(--orange); line-height: 1; }
  .stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
  .card-divider { height: 1px; background: var(--border); margin: 20px 0; }
  .card-desc { font-size: 14px; line-height: 1.6; color: #4B5563; font-weight: 400; }

  .card-insta {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 20px;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    border-radius: 10px; padding: 12px 20px; text-decoration: none;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: #fff;
    box-shadow: 0 4px 14px rgba(253, 29, 29, 0.25);
    transition: opacity 0.2s;
  }
  .card-insta:hover { opacity: 0.9; }

  .no-results { text-align: center; padding: 80px 24px; color: var(--text-muted); font-family: 'Oswald', sans-serif; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; display: none; grid-column: 1/-1; }

  /* ===== CONTENT SECTIONS ===== */
  .content-section { max-width: 900px; margin: 80px auto 0; padding: 0 24px; }
  .content-label { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
  .content-label span { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .content-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .content-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(32px, 5vw, 48px); text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; margin-bottom: 24px; color: var(--text-dark); }
  .content-title em { font-style: normal; color: var(--orange); }
  .content-text { font-size: 15px; line-height: 1.8; color: #4B5563; font-weight: 400; }

  .rules-box { background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--orange); border-radius: 12px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,0.03); }
  .rules-box h3 { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 20px; }
  .rules-box ul { list-style: none; display: grid; gap: 14px; }
  .rules-box li { display: flex; gap: 12px; font-size: 14px; line-height: 1.6; color: #4B5563; }
  .rules-box li span { color: var(--orange); flex-shrink: 0; font-weight: bold; }

  /* ===== TELEGRAM CONTACT ===== */
  .tg-contact-wrap { text-align: center; padding: 40px 24px 16px; }
  .tg-contact-link {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--card-bg); border: 1.5px solid #229ED9;
    border-radius: 50px; padding: 14px 32px;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    color: #229ED9; text-decoration: none;
    box-shadow: 0 4px 16px rgba(34, 158, 217, 0.12);
    transition: all 0.2s;
  }
  .tg-contact-link:hover { background: #229ED9; color: #fff; box-shadow: 0 8px 24px rgba(34, 158, 217, 0.28); }
  .tg-contact-link:hover svg { fill: #fff; }
