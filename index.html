<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анкета Бойца</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --red: #FF2A2A;
      --red-glow: rgba(255, 42, 42, 0.35);
      --grey: #A0A0A0;
      --dark: #0A0A0A;
      --card-bg: #141414;
    }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--dark); 
      color: #fff; 
      min-height: 100vh; 
      padding-bottom: 120px; 
    }
    
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,10,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,42,42,0.3);
      padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 68px;
    }
    .logo-text { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: clamp(14px,2.5vw,18px); letter-spacing: 0.07em; text-transform: uppercase; }
    .logo-text span { color: var(--red); text-shadow: 0 0 10px var(--red-glow); }
    
    .hero { position: relative; padding: 72px 24px 56px; text-align: center; overflow: hidden; }
    .hero::before { content:''; position:absolute; inset:0; background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(255,42,42,0.2) 0%, transparent 70%); pointer-events:none; }
    .hero-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(36px,7vw,72px); text-transform:uppercase; letter-spacing:0.04em; line-height:0.95; margin-bottom:20px; }
    .hero-title em { font-style:normal; color:var(--red); text-shadow: 0 0 15px var(--red-glow); }

    /* ПЛАВАЮЩАЯ КНОПКА ОТКРЫТИЯ АНКЕТЫ */
    .floating-apply-btn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: var(--red); color: #fff; border: none; cursor: pointer;
      font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 16px 36px; border-radius: 50px;
      box-shadow: 0 10px 30px var(--red-glow), 0 0 0 2px rgba(255,255,255,0.15);
      transition: all 0.25s ease; max-width: 90vw; white-space: nowrap;
    }
    .floating-apply-btn:hover {
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 15px 35px rgba(255,42,42,0.6), 0 0 0 2px rgba(255,255,255,0.3);
      background: #ff1111;
    }

    /* МОДАЛЬНОЕ ОКНО */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 2000; display: none; align-items: center; justify-content: center;
      padding: 16px; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }

    .modal-container { position: relative; width: 100%; max-width: 480px; margin: auto; }
    
    .modal-close-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      width: 36px; height: 36px; border-radius: 50%; color: #aaa; font-size: 20px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.2s ease; z-index: 10;
    }
    .modal-close-btn:hover { color: #fff; background: rgba(255,255,255,0.15); }

    /* ФОРМА АНКЕТЫ */
    .form-box {
      background: rgba(22, 22, 24, 0.95);
      border: 1px solid rgba(255, 42, 42, 0.25);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 42, 0.1);
    }
    .form-title { font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px; }
    .form-title em { font-style:normal; color:var(--red); text-shadow: 0 0 10px var(--red-glow); }
    .form-sub { font-size:13px; color:var(--grey); font-weight:300; margin-bottom:24px; line-height:1.5; }

    .form-group { margin-bottom:18px; }
    .form-group label {
      display:block; font-family:'Oswald',sans-serif; font-size:11px;
      letter-spacing:0.14em; text-transform:uppercase; color:#ccc; margin-bottom:6px;
    }
    .form-group label span { color: var(--red); }
    
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group textarea {
      width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1);
      border-radius:10px; padding:12px 16px; color:#fff; font-family:'Inter',sans-serif;
      font-size:14px; outline:none; transition: all 0.25s ease;
    }
    .form-group input[type="text"]:focus,
    .form-group input[type="number"]:focus,
    .form-group textarea:focus {
      border-color:var(--red); background:rgba(255,42,42,0.03);
      box-shadow: 0 0 12px var(--red-glow);
    }
    .form-group textarea { resize:vertical; min-height:85px; line-height:1.5; }

    /* БЛОК ЗАГРУЗКИ ФАЙЛА */
    .file-upload-card {
      position: relative;
      background: rgba(255, 255, 255, 0.02);
      border: 1.5px dashed rgba(255, 42, 42, 0.4);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      display: block;
      transition: all 0.25s ease;
    }
    .file-upload-card:hover {
      border-color: var(--red);
      background: rgba(255, 42, 42, 0.04);
      box-shadow: 0 0 15px var(--red-glow);
    }
    .file-upload-icon { font-size: 24px; margin-bottom: 4px; display: block; }
    .file-upload-text { font-family: 'Oswald', sans-serif; font-size: 13px; text-transform: uppercase; color: #fff; letter-spacing: 0.08em; }
    .file-upload-sub { font-size: 11px; color: var(--grey); margin-top: 2px; }
    .file-upload-card input[type="file"] { display: none; }

    .file-info-badge {
      display: none; align-items: center; justify-content: space-between;
      background: rgba(255, 42, 42, 0.1); border: 1px solid var(--red);
      border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 13px; color: #fff;
    }
    .file-info-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%; }

    .file-remove-btn {
      background: rgba(255, 42, 42, 0.2);
      border: 1px solid var(--red);
      color: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .file-remove-btn:hover { background: var(--red); }

    #photoPreview { margin-top: 12px; display: none; text-align: center; }
    #photoPreview img { max-width: 100%; max-height: 140px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); object-fit: cover; }

    .form-submit-btn {
      width:100%; background:var(--red); color:#fff; border:none; cursor:pointer;
      font-family:'Oswald',sans-serif; font-size:15px; font-weight:700;
      letter-spacing:0.12em; text-transform:uppercase;
      padding:15px; border-radius:10px; margin-top:10px;
      box-shadow: 0 8px 20px var(--red-glow);
      transition: all 0.25s ease;
    }
    .form-submit-btn:hover:not(:disabled) { background:#ff1111; transform: translateY(-1px); box-shadow: 0 12px 25px rgba(255,42,42,0.5); }
  </style>
</head>
<body>

  <header>
    <div class="logo-text">База <span>Бойцов</span></div>
  </header>

  <main class="hero">
    <h1 class="hero-title">База <em>Бойцов</em></h1>
  </main>

  <!-- Плавающая кнопка для вызова анкеты -->
  <button class="floating-apply-btn" id="openModalBtn">Заполнить анкету</button>

  <!-- Модальное окно с анкетой -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-container">
      <div class="form-box">
        <button type="button" class="modal-close-btn" id="closeModalBtn">&times;</button>
        <h2 class="form-title">Анкета <em>бойца</em></h2>
        <p class="form-sub">Заполните все поля — мы рассмотрим вашу кандидатуру и свяжемся с вами.</p>

        <form id="fighterForm" novalidate>
          <div class="form-group">
            <label for="fio">ФИО <span>*</span></label>
            <input type="text" id="fio" name="fio" placeholder="Иванов Иван Иванович" required>
          </div>

          <div class="form-group">
            <label for="age">Возраст <span>*</span></label>
            <input type="number" id="age" name="age" placeholder="18" min="1" max="120" required>
          </div>

          <div class="form-group">
            <label for="description">Характеристика и Описание <span>*</span></label>
            <textarea id="description" name="description" placeholder="Спортивный опыт, достижения, весовая категория, стиль..." required></textarea>
          </div>

          <div class="form-group">
            <label>Фотография <span>*</span></label>
            <label for="photo" class="file-upload-card" id="fileDropZone">
              <span class="file-upload-icon">📸</span>
              <span class="file-upload-text">Загрузить фото</span>
              <span class="file-upload-sub">Нажмите для выбора файла</span>
              <input type="file" id="photo" name="photo" accept="image/*" required>
            </label>

            <div class="file-info-badge" id="fileBadge">
              <span id="fileName">Файл не выбран</span>
              <button type="button" class="file-remove-btn" id="removeFileBtn">Удалить ✕</button>
            </div>

            <div id="photoPreview">
              <img id="photoPreviewImg" src="" alt="Предпросмотр">
            </div>
          </div>

          <button type="submit" class="form-submit-btn">Отправить анкету</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Управление модальным окном
    var openModalBtn = document.getElementById('openModalBtn');
    var closeModalBtn = document.getElementById('closeModalBtn');
    var formModal = document.getElementById('formModal');

    if (openModalBtn && formModal) {
      openModalBtn.addEventListener('click', function() {
        formModal.classList.add('active');
      });
    }

    if (closeModalBtn && formModal) {
      closeModalBtn.addEventListener('click', function() {
        formModal.classList.remove('active');
      });
    }

    // Закрытие кликом вне окна
    window.addEventListener('click', function(e) {
      if (e.target === formModal) {
        formModal.classList.remove('active');
      }
    });

    // Обработка инпута файла
    var photoInput = document.getElementById('photo');
    var fileNameLabel = document.getElementById('fileName');
    var fileBadge = document.getElementById('fileBadge');
    var photoPreview = document.getElementById('photoPreview');
    var photoPreviewImg = document.getElementById('photoPreviewImg');
    var removeFileBtn = document.getElementById('removeFileBtn');

    if (photoInput) {
      photoInput.addEventListener('change', function() {
        var file = photoInput.files[0];
        if (file) {
          if (fileNameLabel) fileNameLabel.textContent = '📎 ' + file.name;
          if (fileBadge) fileBadge.style.display = 'flex';
          
          var reader = new FileReader();
          reader.onload = function(e) {
            if (photoPreviewImg) photoPreviewImg.src = e.target.result;
            if (photoPreview) photoPreview.style.display = 'block';
          };
          reader.readAsDataURL(file);
        } else {
          resetFileInput();
        }
      });
    }

    // Удаление выбранного файла
    if (removeFileBtn) {
      removeFileBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        resetFileInput();
      });
    }

    function resetFileInput() {
      if (photoInput) photoInput.value = '';
      if (fileNameLabel) fileNameLabel.textContent = 'Файл не выбран';
      if (fileBadge) fileBadge.style.display = 'none';
      if (photoPreview) photoPreview.style.display = 'none';
      if (photoPreviewImg) photoPreviewImg.src = '';
    }
  </script>
</body>
</html>
